<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20223d"/>
      <stop offset="1" stop-color="#121325"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#ff3670"/>
    </linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d6bff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="24.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- JSDoc delimiters -->
  <text x="13" y="33" font-family="'DejaVu Sans Mono', monospace" font-size="25"
        font-weight="bold" fill="#6ee7b7" opacity="0.9">/**</text>
  <text x="93" y="122" font-family="'DejaVu Sans Mono', monospace" font-size="25"
        font-weight="bold" fill="#6ee7b7" opacity="0.9">*/</text>

  <!-- comment gutter asterisks -->
  <text x="16" y="64" font-family="'DejaVu Sans Mono', monospace" font-size="17"
        fill="#6ee7b7" opacity="0.35">*</text>
  <text x="16" y="92" font-family="'DejaVu Sans Mono', monospace" font-size="17"
        fill="#6ee7b7" opacity="0.35">*</text>

  <!-- flowchart edges -->
  <g stroke="#c8cbe8" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 68 52 L 68 61"/>
    <path d="M 58 87 L 50 92"/>
    <path d="M 78 87 L 86 92"/>
  </g>
  <g fill="#c8cbe8">
    <path d="M 68 67 L 63.5 60 L 72.5 60 Z"/>
    <path d="M 45 95 L 53.5 94.5 L 49.5 87.5 Z"/>
    <path d="M 91 95 L 82.5 94.5 L 86.5 87.5 Z"/>
  </g>

  <!-- top node -->
  <rect x="46" y="36" width="44" height="17" rx="8.5" fill="url(#node)"/>
  <!-- decision diamond -->
  <g transform="translate(68,77)">
    <rect x="-9.5" y="-9.5" width="19" height="19" rx="4"
          transform="rotate(45)" fill="url(#node2)"/>
  </g>
  <!-- leaf nodes -->
  <rect x="28" y="96" width="26" height="14" rx="7" fill="url(#node)"/>
  <rect x="70" y="96" width="26" height="14" rx="7" fill="url(#node2)"/>
</svg>
